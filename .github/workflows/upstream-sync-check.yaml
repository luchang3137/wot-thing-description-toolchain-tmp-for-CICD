name: Upstream sync check

on:
  schedule:
    # every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check upstream files for updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream files
        run: python3 .github/scripts/check_upstream_sources.py
